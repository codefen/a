name: Deploy Web via FTP

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-ftp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web (Vite -> dist)
        run: bun run build

      - name: Install FTP client library
        run: npm install --no-save basic-ftp

      - name: Deploy dist to FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_SECURE: ${{ secrets.FTP_SECURE }}
          FTP_CLEAN: ${{ secrets.FTP_CLEAN }}
          FTP_LOCAL_DIR: dist
          DEPLOY_ENV: production
        run: |
          cat > deploy.cjs << 'EOF'
          const ftp = require('basic-ftp');
          const fs = require('node:fs');
          const path = require('node:path');

          function required(name) {
            const value = process.env[name];
            if (!value || !value.trim()) {
              throw new Error(`Missing required env var: ${name}`);
            }
            return value.trim();
          }

          async function deploy() {
            const client = new ftp.Client();
            client.ftp.verbose = true;

            try {
              const host = required('FTP_SERVER');
              const user = required('FTP_USERNAME');
              const password = required('FTP_PASSWORD');
              const targetDir = (process.env.FTP_SERVER_DIR || '.').trim();
              const localDir = (process.env.FTP_LOCAL_DIR || 'dist').trim();
              const secure = String(process.env.FTP_SECURE || 'false').toLowerCase() === 'true';
              const clean = String(process.env.FTP_CLEAN || 'false').toLowerCase() === 'true';
              const port = Number(process.env.FTP_PORT || 21);

              const localPath = path.resolve(process.cwd(), localDir);
              if (!fs.existsSync(localPath)) {
                throw new Error(`Local deploy directory does not exist: ${localPath}`);
              }

              console.log('Connecting to FTP host:', host);
              console.log('User:', user);
              console.log('Target dir:', targetDir);
              console.log('Local dir:', localPath);
              console.log('Secure:', secure);
              console.log('Port:', port);

              await client.access({ host, user, password, secure, port });
              console.log('FTP connection successful');

              if (targetDir && targetDir !== '.') {
                await client.ensureDir(targetDir);
                await client.cd(targetDir);
              }

              if (clean) {
                console.log('Cleaning remote target directory before upload');
                await client.clearWorkingDir();
              }

              console.log('Uploading directory...');
              await client.uploadFromDir(localPath);

              console.log('Deploy completed:', process.env.DEPLOY_ENV || 'unknown');
            } catch (err) {
              console.error('Deploy failed:', err);
              process.exit(1);
            } finally {
              client.close();
            }
          }

          deploy();
          EOF
          node deploy.cjs
