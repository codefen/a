<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Anarch AI - Minimal Light</title>
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap">
  <link rel="stylesheet" href="style.css">
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        processEnvironments: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code', 'a']
      }
    };
  </script>
</head>

<body class="layout-home">
  <div class="app-shell">
    <header class="top-nav" id="topNav">
      <div class="top-nav-left">
        <div class="brand-name">Anarch.ai</div>
        <button class="ideas-chip mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-label="Open control panel">
          <span class="ideas-chip__label">ideas novedosas</span>
          <span class="ideas-chip__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" role="img" focusable="false">
              <circle cx="12" cy="12" r="4.6" fill="currentColor"></circle>
              <rect x="10.8" y="1.1" width="2.4" height="4.2" rx="0.8" fill="currentColor"></rect>
              <rect x="10.8" y="18.7" width="2.4" height="4.2" rx="0.8" fill="currentColor"></rect>
              <rect x="18.7" y="10.8" width="4.2" height="2.4" rx="0.8" fill="currentColor"></rect>
              <rect x="1.1" y="10.8" width="4.2" height="2.4" rx="0.8" fill="currentColor"></rect>
              <rect x="10.8" y="1.1" width="2.4" height="4.2" rx="0.8" fill="currentColor" transform="rotate(45 12 12)"></rect>
              <rect x="10.8" y="1.1" width="2.4" height="4.2" rx="0.8" fill="currentColor" transform="rotate(135 12 12)"></rect>
              <rect x="10.8" y="1.1" width="2.4" height="4.2" rx="0.8" fill="currentColor" transform="rotate(225 12 12)"></rect>
              <rect x="10.8" y="1.1" width="2.4" height="4.2" rx="0.8" fill="currentColor" transform="rotate(315 12 12)"></rect>
            </svg>
          </span>
        </button>
      </div>
      <div class="top-nav-right">
        <button class="top-auth-btn top-auth-btn-primary" type="button">Inicia sesión</button>
        <button class="top-auth-btn" type="button">Suscripción libre</button>
      </div>
    </header>

    <div class="app-container" id="appContainer">
      <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h2>Anarch AI</h2>
          <button class="new-chat-btn" id="newChatBtn" type="button">
            <span>+</span> New Chat
          </button>
        </div>

        <div class="config-section" id="configSection">
          <div class="main-config-area">
            <div class="main-controls" id="mainControls">
              <select class="model-select" id="modelSelect">
                <option value="">Loading models...</option>
              </select>
              <div class="action-buttons-group">
                <button class="top-btn" id="refreshModelsBtn" title="Refresh Models" type="button">↻</button>
                <div class="streaming-toggle">
                  <input type="checkbox" id="streamingCheckbox" class="checkbox" checked>
                  <label for="streamingCheckbox">Stream</label>
                </div>
                <button class="top-btn" id="exportSessionBtn" title="Export Chat" type="button">📄</button>
              </div>
            </div>
          </div>
          <div id="modelInfo" class="model-info">Select a model to see information</div>
        </div>

        <div class="sessions-section">
          <h3>Chats</h3>
          <div class="sessions-list" id="sessionsList"></div>
        </div>

        <div class="sidebar-footer">
          <div class="session-controls">
            <input type="text" id="sessionNameInput" class="session-name-input" placeholder="Name this chat...">
            <div id="autoSaveIndicator" class="auto-save-indicator">
              <span>✔</span> Saved
            </div>
          </div>
          <div class="sidebar-actions">
            <button class="sidebar-action-btn" id="importAllBtn" type="button">Import</button>
            <button class="sidebar-action-btn" id="exportAllBtn" type="button">Export</button>
            <button class="sidebar-action-btn delete" id="deleteAllBtn" type="button">Delete All</button>
            <input type="file" id="importFileInput" style="display: none;" accept=".json">
          </div>
        </div>
      </div>

      <div class="sidebar-resizer" id="sidebarResizer"></div>

      <div class="main-content" id="mainContent">
        <div class="chat-container">
          <div class="home-hero" id="homeHero">
            <img class="watermark-a" src="./assets/watermark-a.png" alt="" aria-hidden="true">
            <p class="hero-title">Sincero como siempre. Ilumino dramas.</p>
          </div>

          <div class="chat-messages" id="chatMessages"></div>

          <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">AI is thinking</div>
          </div>

          <div class="input-section">
            <div class="input-container">
              <div class="file-upload-container">
                <div class="uploaded-files" id="uploadedFiles"></div>
                <input type="file" class="file-input" id="fileInput" multiple>
                <button class="icon-btn" id="fileUploadBtn" title="Attach Files" type="button">📎</button>
                <button class="icon-btn" id="imageUploadBtn" title="Attach Images" type="button">🖼️</button>
              </div>

              <textarea class="message-input" id="messageInput" placeholder="..." rows="1"></textarea>

              <div class="action-buttons">
                <button class="icon-btn" id="clearButton" title="Clear Chat" type="button">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                    <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
                  </svg>
                </button>
                <button class="send-button" id="sendButton" title="Send Message" type="button">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M12 18V7" />
                    <path d="M7.5 11.5L12 7l4.5 4.5" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="sidebar-overlay" id="sidebarOverlay"></div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>

</html>
